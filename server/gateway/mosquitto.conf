# The broker for the mqtt service (PRD, Securing the endpoints): TLS on 8883 and nothing else, a
# login per node (named site/subsystem/node), and each login limited to its own topics (mosquitto.acl).
# The files under /mosquitto/certs and the password file are made on the host and mounted
# (README, "MQTT"); none of them is tracked.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

listener 8883
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# An event or a health report is a few hundred bytes; the gateway reads no more than this either.
message_size_limit 8192

persistence true
persistence_location /mosquitto/data
# Refused connections and denied publishes are kept on the mosquitto-log volume, and shown live.
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
