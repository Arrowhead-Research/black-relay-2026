[project]
name = "pytak-gateway"
version = "0.1.0"
authors = [
    { name = "Nico Manzonelli", email = "nicomanzonelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "alembic>=1.13",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.142.2",
    "paho-mqtt>=2.0.0",
    "pydantic>=2.0.0",
    "pytak[with-crypto]>=7.6.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
    "uvicorn>=0.54.0", # ssl_context_factory, used for mTLS (tls.py)
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.10",
]

[project.scripts]
pytak-gw = "pytak_gateway.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
# The same floor the Android side holds (JaCoCo, 80%): `make gateway-test` fails below it.
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
