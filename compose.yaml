# BlackRelay central server: everything that runs on the central node, in one project.
#
#   registry + secrets store   detection/central-store (ports 5000-5003)   images and sealed device secrets
#   broker                     the team's central MQTT broker: 1883 (login) and 8883 (TLS + login)
#   fusion                     the fusion service and its API on 8090
#   rf-analytics               opt-in (profile "rf", ./setup-central.sh --with-rf): polls the RF stack's
#                              Kismet, publishes RF alerts, camera cues and node status to the broker
#
# First time, on the central server, from the repo root:
#   detection/central-store/server.sh init <address> [names]   # registry TLS, logins (and letsencrypt, see its README)
#   detection/central/make-env.sh                               # writes ./.env: broker logins, fusion token
#   docker compose up -d --wait
#
# Publishers connect to <address or reg.bulexa.com>:8883 with TLS and their own login (physical: user
# physical-subsystem, password BROKER_PHYSICAL_PASSWORD in ./.env). Camera kits and the RF console use
# 1883 until they support TLS; rf-analytics runs here and uses the broker directly. Nothing here
# listens anywhere but BIND_ADDRESS.

name: black-relay-central

include:
  - path: detection/central-store/compose.yaml
    env_file: detection/central-store/.env

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  broker:
    <<: *hardening
    image: eclipse-mosquitto:2.1.2-alpine
    # DAC_READ_SEARCH: entrypoint.sh (root) reads the store's private TLS key once, copies it for the
    # mosquitto user, then mosquitto drops root.
    cap_add: [CHOWN, SETUID, SETGID, DAC_READ_SEARCH]
    entrypoint: ["/bin/sh", "/broker/entrypoint.sh"]
    environment:
      BROKER_FUSION_USER: ${BROKER_FUSION_USER:?run detection/central/make-env.sh}
      BROKER_FUSION_PASSWORD: ${BROKER_FUSION_PASSWORD:?run detection/central/make-env.sh}
      BROKER_PHYSICAL_USER: ${BROKER_PHYSICAL_USER:?run detection/central/make-env.sh}
      BROKER_PHYSICAL_PASSWORD: ${BROKER_PHYSICAL_PASSWORD:?run detection/central/make-env.sh}
      BROKER_RF_USER: ${BROKER_RF_USER:?run detection/central/make-env.sh}
      BROKER_RF_PASSWORD: ${BROKER_RF_PASSWORD:?run detection/central/make-env.sh}
      BROKER_CAMERA_USER: ${BROKER_CAMERA_USER:?run detection/central/make-env.sh}
      BROKER_CAMERA_PASSWORD: ${BROKER_CAMERA_PASSWORD:?run detection/central/make-env.sh}
      BROKER_RF_ANALYTICS_USER: ${BROKER_RF_ANALYTICS_USER:?run detection/central/make-env.sh}
      BROKER_RF_ANALYTICS_PASSWORD: ${BROKER_RF_ANALYTICS_PASSWORD:?run detection/central/make-env.sh}
    mem_limit: 256m
    tmpfs: [/tmp, "/run/mosquitto-auth:mode=0700", /mosquitto/log]
    volumes:
      - ./detection/central-broker/mosquitto.conf:/broker/mosquitto.conf:ro
      - ./detection/central-broker/aclfile:/broker/aclfile:ro
      - ./detection/central-broker/entrypoint.sh:/broker/entrypoint.sh:ro
      - ./detection/central-store/state/tls:/tls:ro
      - broker-data:/mosquitto/data
    ports:
      - "${BIND_ADDRESS:?run detection/central/make-env.sh}:1883:1883"
      - "${BIND_ADDRESS}:8883:8883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$BROKER_FUSION_USER\" -P \"$$BROKER_FUSION_PASSWORD\" -t 'detection/#' -E -W 3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fusion:
    <<: *hardening
    build:
      context: ./detection
      dockerfile: fusion-service/Dockerfile
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}black-relay/fusion-service:latest
    depends_on:
      broker: {condition: service_healthy}
    init: true
    environment:
      FUSION_DATABASE: /data/fusion.sqlite3
      FUSION_CAMERA_SCHEMAS: /contracts/camera
      FUSION_RF_SCHEMAS: /contracts/rf
      FUSION_PHYSICAL_SCHEMAS: /contracts/physical
      FUSION_API_TOKEN: ${FUSION_API_TOKEN:?run detection/central/make-env.sh}
      FUSION_CENTRAL_MQTT_USER: ${BROKER_FUSION_USER}
      FUSION_CENTRAL_MQTT_PASSWORD: ${BROKER_FUSION_PASSWORD}
      # The kits' broker password: fusion derives the kits' Frigate proxy secret from it.
      FUSION_CAMERA_PASSWORD: ${BROKER_CAMERA_PASSWORD}
    ports:
      - "${BIND_ADDRESS}:8090:8090"
    volumes:
      - fusion-data:/data
      - ./detection/central/fusion.config.yaml:/config/config.yaml:ro
    tmpfs: ["/tmp:size=16m"]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,json,urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/api/v1/health',headers={'Authorization':'Bearer '+os.environ['FUSION_API_TOKEN']}); assert json.load(urllib.request.urlopen(r,timeout=3))['storage']['ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # RF live analytics: polls the RF stack's Kismet server, runs the alert rules and publishes alerts,
  # camera cues and node status under detection/rf/ with its own broker login. Opt in with
  # ./setup-central.sh --with-rf (sets COMPOSE_PROFILES=rf, the Kismet URL and login in ./.env).
  # Kismet stays in the RF stack (detection/rf-subsystem/central), which the nodes stream to; on this
  # host it joins the shared Docker network "fusion" as rf-kismet. Site, rules and friendly files come
  # from detection/rf-subsystem/analytics/config (RF_SITE, RF_RULES, RF_FRIENDLY in ./.env).
  rf-analytics:
    <<: *hardening
    profiles: [rf]
    build:
      context: ./detection/rf-subsystem/analytics
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}black-relay/rf-analytics:latest
    depends_on:
      broker: {condition: service_healthy}
    init: true
    environment:
      KISMET_USER: ${RF_KISMET_USER:-}
      KISMET_PASSWORD: ${RF_KISMET_PASSWORD:-}
      RF_BROKER_PASSWORD: ${BROKER_RF_ANALYTICS_PASSWORD}
    command:
      - live
      - --kismet-url=${RF_KISMET_URL:-http://rf-kismet:2501}
      - --site=/config/${RF_SITE:-site.wbt-nodes.example.yaml}
      - --rules=/config/${RF_RULES:-rules.wbt-live.example.yaml}
      - --friendly=/config/${RF_FRIENDLY:-friendly.wbt-nodes.example.yaml}
      - --publish-host=broker
      - --publish-user=${BROKER_RF_ANALYTICS_USER}
      - --publish-password-env=RF_BROKER_PASSWORD
      - --topic-prefix=detection/rf
      - --outbox=/data/rf-outbox.jsonl
      - --events-out=/data/events.jsonl
    tmpfs: ["/tmp:size=16m"]
    volumes:
      - ./detection/rf-subsystem/analytics/config:/config:ro
      - rf-analytics-data:/data
    networks: [default, fusion]
    stop_grace_period: 15s

networks:
  # The shared host network the RF stack's Kismet joins (as rf-kismet). Only rf-analytics uses it, so
  # it has to exist only with the "rf" profile; setup-central.sh --with-rf creates it.
  fusion:
    external: true

volumes:
  broker-data:
  fusion-data:
  rf-analytics-data:
