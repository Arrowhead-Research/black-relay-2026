---
name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  credential-free-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build pinned development image
        run: docker compose -f dev/compose.yml build

      - name: Run lint checks
        run: >-
          docker compose -f dev/compose.yml run --rm --no-deps
          --entrypoint make pi lint

      - name: Run validation checks
        run: >-
          docker compose -f dev/compose.yml run --rm --no-deps
          --env TF_DATA_DIR=/tmp/opentofu-data
          --entrypoint make pi validate
