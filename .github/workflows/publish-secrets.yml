# Publishes device secret bundles to PRIVATE ghcr.io packages, where devices fetch them
# (`detection/central-store/secrets.sh fetch`). Each bundle is age-encrypted on the device it belongs
# to and stored as a GitHub secret named BUNDLE_<anything> in the `secrets` environment:
#   detection/central-store/secrets.sh seal kit-01 deploy data/pki secrets --out kit-01.age
#   gh secret set BUNDLE_KIT_01 --env secrets < kit-01.age
# Nothing here can decrypt a bundle. Run by hand (Actions > publish-secrets > Run workflow); give the
# `secrets` environment a required reviewer so every run needs approval.
name: publish-secrets

on:
  workflow_dispatch:
  # Until this is on main ("Run workflow" needs main): a push to this branch that changes this file runs it once.
  # Remove after merge. (Edit this line to publish again from the branch: 2026-11-20 device `bridge`.)
  push:
    branches: [claude/project-thread-o7nn33]
    paths: [".github/workflows/publish-secrets.yml"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: secrets
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oras-project/setup-oras@v1
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Write the BUNDLE_* secrets to files (runner temp, removed with the runner)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          umask 077; mkdir -p "$RUNNER_TEMP/bundles"
          jq -r 'to_entries[] | select(.key | startswith("BUNDLE_")) | .key' <<<"$ALL" | while read -r k; do
            jq -r --arg k "$k" '.[$k]' <<<"$ALL" >"$RUNNER_TEMP/bundles/$k"
          done
          compgen -G "$RUNNER_TEMP/bundles/*" >/dev/null || { echo "no BUNDLE_* secrets in the secrets environment"; exit 1; }
      - name: Publish
        run: |
          detection/central-store/publish-bundles.sh "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blackrelay-secrets" "$RUNNER_TEMP"/bundles/*
          rm -rf "$RUNNER_TEMP/bundles"
