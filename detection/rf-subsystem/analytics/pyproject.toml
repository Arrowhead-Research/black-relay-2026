[project]
name = "rfanalytics"
version = "0.1.0"
description = "RF subsystem analytics: ingest, friendly exclusion, visits, and zone localization"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
rfanalytics = "rfanalytics.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.20", "rfsim"]

[tool.uv.sources]
rfsim = { path = "../simulator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfanalytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
