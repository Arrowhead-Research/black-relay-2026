# rf-node: keep the kernel's DVB-T TV-tuner drivers off the RTL-SDR, so rtl_433
# (Kismet's TPMS helper) always gets the device. Without this the kernel binds
# the dongle at boot and rtl_433 has to detach it first.
# Install: sudo install -m 644 rf-rtlsdr-blacklist.conf /etc/modprobe.d/
blacklist dvb_usb_rtl28xxu
blacklist rtl2832
blacklist rtl2832_sdr
blacklist rtl2830
