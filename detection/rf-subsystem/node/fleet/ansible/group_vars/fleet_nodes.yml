# Shared by the RF and camera nodes. Group-specific settings are in rf_nodes.yml and camera_nodes.yml.

# Reached by mDNS until host_vars give an address (its LAN address or DHCP reservation).
ansible_host: "{{ inventory_hostname }}.local"
# fleet.sh exports these from fleet.env (ADMIN_USER, SSH_KEY).
ansible_user: "{{ lookup('ansible.builtin.env', 'FLEET_ADMIN_USER') | default('pi', true) }}"
ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'FLEET_SSH_KEY') | default('~/.ssh/blackrelay_fleet', true) }}"
# Host keys are kept by node name, so a node reached at 10.42.0.1 (setup or rescue hotspot) or a new
# DHCP address is still checked against its own key; fleet.sh seed forgets a node's key when it re-seeds.
ansible_ssh_extra_args: >-
  -o HostKeyAlias={{ inventory_hostname }}
  -o UserKnownHostsFile={{ lookup('ansible.builtin.env', 'FLEET_KNOWN_HOSTS') | default('~/.ssh/blackrelay_fleet_known_hosts', true) }}

# The central server's LAN address: where Kismet capture (TCP 3501) and console heartbeats (8080) go,
# and the one host a camera node's firewall admits. Nodes are not on the tailnet; the RF stack must
# bind 3501/8080 on this address (BIND_ADDR in its .env).
central_host: 172.20.100.150

# Central MQTT broker (the root compose's `broker`, shared with the physical subsystem). Each node logs
# in with its own login (rf-node-<node> or cam-node-<node>) over TLS. The certificate is Let's Encrypt
# for broker_host; broker_address pins that name in /etc/hosts so it works on the LAN whatever DNS says
# (empty: use DNS). For the plain login listener: broker_port: 1883, broker_tls: false.
broker_host: reg.bulexa.com
broker_port: 8883
broker_tls: true
broker_address: 172.20.100.150

# Provisioning without SSH to the central server: fleet.sh sets central_secrets_file to CENTRAL_SECRETS,
# the saved output of detection/central/node-secrets.sh ("<key> <value>" lines), and the node plays read
# their logins from it instead of from the central host.
central_secrets_file: ""
central_secrets: "{{ dict(lookup('ansible.builtin.file', central_secrets_file).splitlines() | select | map('split', ' ', 1)) }}"
