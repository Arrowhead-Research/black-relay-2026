# The RF fleet. The node name is the hostname, the Kismet source prefix (wbt-4:wifi ...) and the
# analytics node_id. Per-node settings (address, adapters) go in host_vars/<node>.yml; see
# host_vars/wbt-1.yml.example.
all:
  children:
    rf_nodes:
      hosts:
        wbt-1:
        wbt-2:
        wbt-3:
        wbt-4:
    # The central server: the playbook reads (or creates) the console's node heartbeat token there.
    central:
      hosts:
        rf-central:
          ansible_host: 172.20.100.150
