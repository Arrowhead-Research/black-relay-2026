# The rules apply with a reload when they change (established sessions survive). A node that had no
# table at all (first provision) also reboots at the end, so every unit starts under it.
- name: Where is Ansible connecting from?
  ansible.builtin.shell: echo "${SSH_CLIENT%% *}"
  become: false
  register: controller_ip
  changed_when: false
  check_mode: false

- name: Addresses that may SSH in
  ansible.builtin.set_fact:
    admin_entries: >-
      {{ (fleet_admin_nets + ([controller_ip.stdout | trim] if (controller_ip.stdout | trim) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$') else []))
         | unique | list }}

- name: Check them
  ansible.builtin.assert:
    that:
      - admin_entries | select('match', '^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$') | list | length == admin_entries | length
      - central_host is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: "fleet_admin_nets and central_host must be IPv4 addresses or networks (got {{ admin_entries }}, {{ central_host }})"
    quiet: true

# Never load rules that would shut out the machine running this: it must be admitted by its own address.
- name: The controller's IPv4 address is known
  ansible.builtin.assert:
    that: (controller_ip.stdout | trim) is match('^[0-9]{1,3}(\.[0-9]{1,3}){3}$')
    fail_msg: >-
      Ansible is connected to {{ inventory_hostname }} from '{{ controller_ip.stdout | trim }}', not an IPv4
      address, so the firewall would lock this machine out. Connect over IPv4 (ansible_host: <its IPv4>).
    quiet: true

- name: Is the table loaded?
  ansible.builtin.command: nft list table inet black_relay
  register: table_loaded
  changed_when: false
  failed_when: false
  check_mode: false

- name: Included address lists
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/black-relay/{{ item }}"
    mode: "0644"
  loop: [central-hosts.nft, admin-hosts.nft]
  register: nft_lists

- name: Firewall rules (checked with nft -c before they are installed)
  ansible.builtin.template:
    src: black-relay-fleet.nft.j2
    dest: /etc/nftables.conf
    mode: "0755"
    validate: /usr/sbin/nft -c -f %s
  register: nft_conf

- name: Firewall on at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true

- name: Load it now
  ansible.builtin.systemd_service:
    name: nftables
    state: "{{ 'reloaded' if table_loaded.rc == 0 else 'started' }}"
  when: nft_conf is changed or nft_lists is changed or table_loaded.rc != 0

- name: Reboot needed for the first firewall
  ansible.builtin.set_fact:
    reboot_reasons: "{{ reboot_reasons + ['firewall'] }}"
  when: table_loaded.rc != 0
