- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Restart timesyncd
  ansible.builtin.systemd_service:
    name: systemd-timesyncd
    state: restarted

- name: Restart camera services
  ansible.builtin.command: docker compose -f {{ camera_install_dir }}/node/compose.yaml restart camerabridge camera-link
