# Development MQTT broker. Stands in for the fusion broker until the fusion
# team publishes its standard (DESIGN.md, open question 1).
#
# Anonymous access is acceptable only because the port is bound to localhost
# or the tailnet. Do not reuse this configuration for the field deployment.
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
log_dest stdout
