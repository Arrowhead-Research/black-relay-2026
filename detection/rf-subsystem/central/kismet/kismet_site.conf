# Site overrides for the central Kismet server. Values here take precedence
# over the packaged defaults in /etc/kismet/kismet*.conf.

server_name=rf-central
server_description=Black Relay RF subsystem central Kismet server

# Listen on all container interfaces. Host exposure is controlled by the port
# bindings in docker-compose.yml (tailnet or localhost only, never public).
httpd_bind_address=0.0.0.0
httpd_port=2501

# Remote capture. Recent releases also accept remote sources over WebSocket on
# the httpd port; the legacy TCP listener is kept for compatibility while we
# confirm which mode the nodes will use (DESIGN.md, open question 5).
remote_capture_enabled=true
remote_capture_listen=0.0.0.0
remote_capture_port=3501

# Keep the raw .kismet log so analytics can be reprocessed later.
log_prefix=/var/lib/kismet/logs/
log_types=kismet
