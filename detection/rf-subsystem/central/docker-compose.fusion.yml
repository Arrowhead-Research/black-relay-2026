# Shared host (the central server): put Kismet on the shared Docker network
# "fusion" as rf-kismet, where rf-analytics from the repo-root compose.yaml
# polls it, and publish only what must be reachable from outside Docker.
# Enable it in .env with
#   COMPOSE_FILE=docker-compose.yml:docker-compose.fusion.yml
# Create the network once with `docker network create fusion`
# (../../../setup-central.sh --with-rf does). Claim every published port in
# the host's PORTS.md first.

services:
  kismet-server:
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:3501:3501"   # node capture helpers
      - "127.0.0.1:2501:2501"                  # Kismet UI/REST: SSH tunnel only
    networks:
      default: {}
      fusion:
        aliases: [rf-kismet]

networks:
  fusion:
    external: true
