name: loiterer
description: >
  At night, a person on foot leaves the road, loiters at the north entrance
  for 15 minutes, moves to the east lot for 5 minutes, then leaves. Light
  background traffic. Expected: a loiter alert for north-entrance (dwell over
  10 minutes) and zone estimates that follow the subject from north-entrance
  to east-lot.
site: ../sites/dev-site.yaml
start_time: "2026-11-02T23:00:00Z"
duration: "1:00:00"
seed: 303

background:
  road: { from: [-20, 40], to: [60, 40] }
  pedestrians_per_hour: 6
  vehicles_per_hour: 15

actors:
  - id: safehouse-ap
    role: infrastructure
    friendly: true
    devices:
      - { kit: access_point, attributes: { ssid: RELAY-OPS } }
    path:
      - { t: 0, pos: [20, 12] }
      - { t: end, pos: [20, 12] }

  - id: subject-1
    role: subject
    devices: [phone, smartwatch]
    path:
      - { t: "0:10:00", pos: [-20, 40] }   # walking east along the road
      - { t: "0:10:25", pos: [15, 40] }
      - { t: "0:10:35", pos: [20, 27] }    # steps into north-entrance
      - { t: "0:25:35", pos: [22, 26] }    # 15 min loiter, drifting slightly
      - { t: "0:26:05", pos: [36, 22] }    # to east-lot
      - { t: "0:31:05", pos: [38, 18] }    # 5 min in east-lot
      - { t: "0:31:30", pos: [38, 40] }    # back to the road
      - { t: "0:32:20", pos: [60, 40] }
