[project]
name = "rfsim"
version = "0.1.0"
description = "Multi-node RF observation simulator for the Black Relay RF subsystem"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]

[project.scripts]
rfsim = "rfsim.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
