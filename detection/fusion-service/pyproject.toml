[project]
name = "black-relay-event-fusion-api"
version = "0.1.0"
description = "Central MQTT ingestion and normalized JSON REST API for Black Relay."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.32,<1",
  "pydantic>=2.11,<3",
  "paho-mqtt>=2.1,<3",
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[dependency-groups]
dev = ["ruff>=0.9,<1", "pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
fusion-service = "fusion_service.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fusion_service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
