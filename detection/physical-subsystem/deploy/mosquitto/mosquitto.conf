# Consumer-facing broker: TLS only, authenticated, ACL-enforced read-only for consumers.
per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 8883
protocol mqtt
cafile /certs/ca.crt
certfile /certs/broker/broker.crt
keyfile /certs/broker/broker.key
tls_version tlsv1.2
require_certificate false
# no plaintext (1883) listener exists
