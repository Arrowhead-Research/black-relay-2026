# BlackRelay F2 -- one-way sensor bridge as separate microservices.
#
#   iq-remote ──(ipc-iq)──┐                      ┌─> outbound ──> mosquitto(8883) / REST+SSE(8443) / metrics(127.0.0.1:9100)
#                         ├─> normalizer ─(ipc-out)┘
#   control4  ──(ipc-c4)──┘
#   iq-remote ──(beacon, rw)──> control4 (ro)     primary-link beacon: the ONLY panel-adapter-to-panel-adapter channel
#
# One-way structure (every item is enforced and tested in tests/):
#  * one IPC volume PER adapter, mounted only in that adapter and the normalizer: an adapter cannot even see the other
#    adapter's socket, nor the output socket; outbound cannot reach any adapter socket.
#  * each socket is half-duplex at kernel level (SHUT_RD on senders / SHUT_WR on receivers): no reverse bytes.
#  * the normalizer has network_mode none (no IP network at all) and a distinct uid.
#  * outbound has no panel credentials (no PKI, no Control4 token).
#  * adapters hold the only panel credentials; their write paths are allow-listed (exact INFO/SUMMARY; exact
#    connect/ping/pair-status/syncdatabase envelopes) and ALSO fenced in the kernel by nftables/blackrelay-egress.nft
#    (distinct uids: iq-remote -> panel:8883 only, control4 -> panel:12345 only).
#  * mosquitto ACL: only user `blackrelay` can publish; consumers are read-only; the bridge never subscribes.
#  * secrets/keys are 0600 and owned by the single uid that reads them (scripts/gen-certs.sh); ca.key is never mounted.
name: blackrelay
# Images come from GitHub Container Registry (ghcr.io/arrowhead-research/..., built by
# .github/workflows/publish-images.yml) by default. IMAGE_PREFIX= (empty, in .env) uses local builds.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs: ["/tmp"]
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

services:
  # One-shot first-start setup, so a new machine needs only `docker compose up` (and a deploy/.env, see
  # .env.example): this machine's key, local certs and logins, config.yaml, and the panel pairing fetched from
  # the secrets registry (it waits, printing the line to send Jayden, until the pairing is published for this
  # machine). Later starts find everything in place and exit at once. scripts/bootstrap.sh.
  bootstrap:
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}black-relay/central-tools:latest
    build: {context: ../../central-store/tools}
    network_mode: host             # reaches the secrets registry; serves nothing
    user: "0:0"                    # only to hand files to the container uids
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    entrypoint: ["bash", "/deploy/scripts/bootstrap.sh"]
    environment:
      DEVICE: ${DEVICE:-}
      PANEL_IP: ${PANEL_IP:-}
      BRIDGE_HOSTS: ${BRIDGE_HOSTS:-127.0.0.1}
      REGISTRY_USER: ${REGISTRY_USER:-}
      REGISTRY_TOKEN: ${REGISTRY_TOKEN:-}
      SECRETS_BASE: ${SECRETS_BASE:-ghcr.io/arrowhead-research/blackrelay-secrets}
      SECRETS_CA: ${SECRETS_CA:-}
      PAIRING_BUNDLE: ${PAIRING_BUNDLE:-}
      FUSION_PASSWORD: ${FUSION_PASSWORD:-}
      BOOTSTRAP_WAIT_S: ${BOOTSTRAP_WAIT_S:-0}
    volumes:
      - .:/deploy
      - ${BR_HOME:-${HOME}/.black-relay}:/br

  # one-shot root helper: gives every named volume its owner (uids per docker/Dockerfile.*; shared group 10000).
  init-perms:
    # base images are pinned by digest (resolved 2026-11-15); bump deliberately (docker buildx imagetools inspect <tag>)
    image: python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
    network_mode: none
    user: "0:0"
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    depends_on: {bootstrap: {condition: service_completed_successfully}}
    volumes:
      - ipc-iq:/v/ipc-iq
      - ipc-c4:/v/ipc-c4
      - ipc-out:/v/ipc-out
      - beacon:/v/beacon
      - store:/v/store
      - out-state:/v/out-state
      - fusion-state:/v/fusion-state
      - mosquitto-data:/v/mosquitto-data
    command:
      - sh
      - -c
      - |
        set -e
        chown 10004:10000 /v/ipc-iq /v/ipc-c4 /v/ipc-out /v/store && chmod 2770 /v/ipc-iq /v/ipc-c4 /v/ipc-out
        chown 10001:10000 /v/beacon && chmod 0750 /v/beacon        # iq-remote writes, control4 (group) reads
        chown 10003:10000 /v/out-state /v/fusion-state && chmod 0700 /v/out-state /v/fusion-state
        chown 1883:1883 /v/mosquitto-data && chmod 0700 /v/mosquitto-data   # mosquitto runs as uid 1883, not root
        chmod 0770 /v/store

  normalizer:
    <<: *hardening
    build: {context: .., dockerfile: docker/Dockerfile.normalizer}
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/normalizer:latest
    user: "10004:10000"
    network_mode: none
    depends_on: {init-perms: {condition: service_completed_successfully}}
    volumes:
      - ipc-iq:/ipc-iq
      - ipc-c4:/ipc-c4
      - ipc-out:/ipc-out
      - store:/data
      - ./config:/config:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/ipc-out/out.sock') else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

  iq-remote:
    <<: *hardening
    build: {context: .., dockerfile: docker/Dockerfile.iq-remote}
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/iq-remote:latest
    user: "10001:10000"
    network_mode: host            # must reach the panel on the LAN (panel_ip); publishes no ports; see nftables/
    depends_on: {normalizer: {condition: service_healthy}}
    volumes:
      - ipc-iq:/ipc-iq
      - beacon:/beacon              # rw: the only writer of the primary-link beacon
      - ./data/pki:/data/pki:ro
      - ./config:/config:ro

  # Field tools as the SERVICE uid: `docker compose run --rm iq-tools snapshot|watch|repin --config /config/config.yaml`.
  # Same image, uid and host networking as iq-remote, so the nftables rule for uid 10001 (panel:8883 only) covers it and
  # every file it writes (a repinned panel pin) is owned by uid 10001, which is what iq-remote reads. The pki dir is
  # mounted read-write here only (iq-remote mounts it read-only). `br2 pair` is NOT available here: it needs inbound
  # connections and mDNS, which that uid is not allowed; run it on the host (README, Startup).
  iq-tools:
    <<: *hardening
    restart: "no"
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/iq-remote:latest
    profiles: ["tools"]
    user: "10001:10000"
    network_mode: host
    entrypoint: ["python", "-m", "br2"]
    command: ["snapshot", "--config", "/config/config.yaml"]
    volumes:
      - ./data/pki:/data/pki
      - ./config:/config:ro

  control4:
    <<: *hardening
    build: {context: .., dockerfile: docker/Dockerfile.control4}
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/control4:latest
    user: "10002:10000"
    network_mode: host
    depends_on: {normalizer: {condition: service_healthy}}
    volumes:
      - ipc-c4:/ipc-c4
      - beacon:/beacon:ro           # read-only: control4 can never forge the primary's link state
      - ./config:/config:ro
      - ./secrets/control4:/run/secrets:ro   # control4_token only (config: control4.token_file: /run/secrets/control4_token)
    # Start only when control4.enabled: true in config.yaml, e.g.:  docker compose --profile fallback up -d
    profiles: ["fallback"]

  outbound:
    <<: *hardening
    build: {context: .., dockerfile: docker/Dockerfile.outbound}
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/outbound:latest
    user: "10003:10000"
    network_mode: host            # serves 8443 (+ 9100 on metrics_host, default 127.0.0.1); reaches mosquitto at 127.0.0.1:8883
    depends_on:
      normalizer: {condition: service_healthy}
      mosquitto: {condition: service_started}
    volumes:
      - ipc-out:/ipc-out
      - store:/data:ro             # SQLite WAL: only ever read (mode=ro); a read-only mount works for WAL readers
      - out-state:/state           # replay pointer + published-topic set (outbound's own durable state)
      - ./certs/outbound:/certs:ro # CA + the API key pair only; the broker key is never visible here
      - ./config:/config:ro
      - ./secrets/outbound:/run/secrets:ro   # mqtt_password only
    environment:
      BR2_FUSION_STANDALONE: "1"   # the team output runs in the `fusion` service below, never twice
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; c=ssl.create_default_context(cafile='/certs/ca.crt'); c.check_hostname=False; u.urlopen('https://127.0.0.1:8443/v1/health', context=c, timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Team ("fusion") MQTT publisher. OPTIONAL: only started with `docker compose --profile fusion up -d`, and only
  # when fusion.enabled: true in config.yaml. It is the same outbound image and code (br2.outbound.fusion); it is a
  # separate container only because `outbound` uses host networking and so cannot join a Docker network.
  # Sends to the central broker over the LAN (fusion.host, port 1883) with its own login:
  # put the password (BROKER_PHYSICAL_PASSWORD from the central server's .env) in secrets/fusion/fusion_password, owned by
  # uid 10003, mode 0600. Publish-only: it reads the one-way IPC stream + the event log and sends to the team broker.
  fusion:
    <<: *hardening
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/outbound:latest
    profiles: ["fusion"]
    user: "10003:10000"
    command: ["service", "fusion", "--config", "/config/config.yaml"]
    networks: [fusion-out]         # its own outbound-only network: no host network, no panel access, no local broker
    depends_on:
      normalizer: {condition: service_healthy}
    volumes:
      - ipc-out:/ipc-out
      - store:/data:ro             # the event log is only read: mounted read-only
      - fusion-state:/state        # its OWN small volume: the outbox journal + producer cursor (/state/fusion)
      - ./config:/config:ro
      - ./secrets/fusion:/run/secrets:ro     # fusion_password only (fusion.password_file: /run/secrets/fusion_password)
    # Lets the publisher reach the central broker by its certificate name even where LAN DNS will not resolve it
    # (setup-central.sh --with-bridge sets these; the default is an unused placeholder).
    extra_hosts: ["${CENTRAL_BROKER_NAME:-central-broker.invalid}:${CENTRAL_BROKER_IP:-127.0.0.1}"]
    # Health/metrics: the service serves /metrics and /healthz on fusion.metrics_host:fusion.metrics_port (default
    # 127.0.0.1:9101, i.e. inside this container only). Unhealthy = the producer loop stalled, or the oldest queued
    # message is older than fusion.health_max_backlog_age_s (broker unreachable / not acking). Outbox depth, drops and
    # last PUBACK age are in /metrics (physical_fusion_*). To let a Prometheus on the fusion network scrape it, set
    # fusion.metrics_host: 0.0.0.0 in config.yaml (plain HTTP, no secrets in the output).
    healthcheck:
      test: ["CMD", "python", "-m", "br2", "healthcheck", "fusion", "--config", "/config/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  mosquitto:
    # pinned by digest (resolved 2026-11-15); the tag is kept for readers
    image: eclipse-mosquitto:2.0.18@sha256:d12c8f80dfc65b768bb9acecc7ef182b976f71fb681640b66358e5e0cf94e9e9
    <<: *hardening
    user: "1883:1883"             # non-root (the image's mosquitto user); keys are 0600 owned by 1883 (gen-certs.sh)
    depends_on: {init-perms: {condition: service_completed_successfully}}
    # TLS only, no 1883. BRIDGE_MQTT_PORT=8884 (deploy/.env) when this host also runs the central broker on 8883;
    # then set mqtt.port: 8884 in config.yaml too (setup-central.sh --with-bridge does both).
    ports: ["${BRIDGE_MQTT_PORT:-8883}:8883"]
    volumes:
      - ./mosquitto:/mosquitto/config:ro     # mosquitto.conf, acl, passwd (generated)
      - ./certs/mosquitto:/certs:ro          # CA + the broker key pair only
      - mosquitto-data:/mosquitto/data

  # `docker compose --profile '*' build` first, then `docker compose run --rm bridge hash-key`  -> prints a new API key (once), its key_id and its argon2 hash
  bridge:
    <<: *hardening
    restart: "no"
    image: ${IMAGE_PREFIX-ghcr.io/arrowhead-research/}blackrelay-f2/outbound:latest
    profiles: ["tools"]
    user: "10003:10000"
    network_mode: none
    entrypoint: ["python", "-m", "br2"]
    command: ["hash-key"]

networks:
  fusion-out: {}                   # only the `fusion` profile uses it; reaches the central broker through the host's LAN

volumes:
  ipc-iq:
  ipc-c4:
  ipc-out:
  beacon:
  store:
  out-state:
  fusion-state:
  mosquitto-data:
