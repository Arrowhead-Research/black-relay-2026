# Single-host stack for sf-dev: central broker, fusion, the physical simulator bench, and the RF
# simulator feeding rf-analytics through the same broker. See README.md.
#
#   ./make-env.sh <bind address>  # writes .env
#   docker load -i images.tar
#   docker compose up -d --wait

name: black-relay-sfdev

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  broker:
    <<: *hardening
    image: eclipse-mosquitto:2.1.2-alpine
    cap_add: [CHOWN, SETUID, SETGID]
    entrypoint: ["/bin/sh", "/broker/entrypoint.sh"]
    environment:
      BROKER_FUSION_USER: ${BROKER_FUSION_USER:?run ./make-env.sh}
      BROKER_FUSION_PASSWORD: ${BROKER_FUSION_PASSWORD:?run ./make-env.sh}
      BROKER_PHYSICAL_USER: ${BROKER_PHYSICAL_USER:?run ./make-env.sh}
      BROKER_PHYSICAL_PASSWORD: ${BROKER_PHYSICAL_PASSWORD:?run ./make-env.sh}
      BROKER_RF_USER: ${BROKER_RF_USER:?run ./make-env.sh}
      BROKER_RF_PASSWORD: ${BROKER_RF_PASSWORD:?run ./make-env.sh}
      BROKER_CAMERA_USER: ${BROKER_CAMERA_USER:?run ./make-env.sh}
      BROKER_CAMERA_PASSWORD: ${BROKER_CAMERA_PASSWORD:?run ./make-env.sh}
    mem_limit: 256m
    tmpfs: [/tmp, "/run/mosquitto-auth:mode=0700", /mosquitto/log]
    volumes:
      - ./broker/mosquitto.conf:/broker/mosquitto.conf:ro
      - ./broker/aclfile:/broker/aclfile:ro
      - ./broker/entrypoint.sh:/broker/entrypoint.sh:ro
      - broker-data:/mosquitto/data
    ports:
      - "${BIND_ADDRESS:?run ./make-env.sh}:1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -u \"$$BROKER_FUSION_USER\" -P \"$$BROKER_FUSION_PASSWORD\" -t 'detection/#' -E -W 3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  fusion:
    <<: *hardening
    image: black-relay/fusion-service:sfdev
    depends_on:
      broker: {condition: service_healthy}
    init: true
    environment:
      FUSION_DATABASE: /data/fusion.sqlite3
      FUSION_CAMERA_SCHEMAS: /contracts/camera
      FUSION_RF_SCHEMAS: /contracts/rf
      FUSION_PHYSICAL_SCHEMAS: /contracts/physical
      FUSION_API_TOKEN: ${FUSION_API_TOKEN:?run ./make-env.sh}
      FUSION_CENTRAL_MQTT_USER: ${BROKER_FUSION_USER}
      FUSION_CENTRAL_MQTT_PASSWORD: ${BROKER_FUSION_PASSWORD}
      # The kits' broker password: fusion derives the kits' Frigate proxy secret from it to
      # fetch detection snapshots (GET /api/v1/events/{id}/snapshot).
      FUSION_CAMERA_PASSWORD: ${BROKER_CAMERA_PASSWORD}
    ports:
      - "${BIND_ADDRESS}:8090:8090"
    volumes:
      - fusion-data:/data
      - ./fusion.config.yaml:/config/config.yaml:ro
    tmpfs: ["/tmp:size=16m"]
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-c", "import os,json,urllib.request; r=urllib.request.Request('http://127.0.0.1:8090/api/v1/health',headers={'Authorization':'Bearer '+os.environ['FUSION_API_TOKEN']}); assert json.load(urllib.request.urlopen(r,timeout=3))['storage']['ready']"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Panel simulator + the physical bridge (bench.sh --simulator), publishing to `broker`.
  # Drive it:  docker compose exec physical-sim sh -c 'echo "zone 12 Open" > /app/fusion-service/bench/sim.in'
  physical-sim:
    image: black-relay/physical-sim:sfdev
    restart: unless-stopped
    init: true
    depends_on:
      broker: {condition: service_healthy}
    environment:
      BENCH_FUSION_HOST: broker
      BENCH_FUSION_PORT: "1883"
      BENCH_FUSION_USER: ${BROKER_PHYSICAL_USER}
      BENCH_FUSION_PASSWORD: ${BROKER_PHYSICAL_PASSWORD}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  rf-analytics:
    <<: *hardening
    image: black-relay/rf-analytics:sfdev
    depends_on:
      broker: {condition: service_healthy}
    environment:
      RF_PASSWORD: ${BROKER_RF_PASSWORD}
    command:
      - run
      - --site=/rf/dev-site.yaml
      - --rules=/app/config/rules.example.yaml
      - --friendly=/app/config/friendly.example.yaml
      - --mqtt-host=broker
      - --mqtt-user=${BROKER_RF_USER}
      - --mqtt-password-env=RF_PASSWORD
      - --publish-host=broker
      - --publish-user=${BROKER_RF_USER}
      - --publish-password-env=RF_PASSWORD
      - --outbox=/data/rf-outbox.jsonl
      - -o
      - none
    volumes:
      - ./rf/dev-site.yaml:/rf/dev-site.yaml:ro
      - rf-analytics-data:/data
    tmpfs: [/tmp]

  # Replays the one-hour scenario in real time (faster runs stamp observations in the future and
  # fusion rejects anything more than 60 s ahead); the restart policy starts it again when it ends.
  # Observations go to detection/rf/sim/observations on the central broker, which only the RF
  # credential can read; fusion does not subscribe to it.
  rfsim:
    <<: *hardening
    image: black-relay/rfsim:sfdev
    depends_on:
      broker: {condition: service_healthy}
    environment:
      RF_PASSWORD: ${BROKER_RF_PASSWORD}
    command: [run, /app/scenarios/loiterer.yaml, --start-now, --realtime, --mqtt-host, broker, --mqtt-user, "${BROKER_RF_USER}", --mqtt-password-env, RF_PASSWORD, -o, /dev/null]
    tmpfs: [/tmp]

volumes:
  broker-data:
  fusion-data:
  rf-analytics-data:
