# Central team broker. One password-protected listener; the ACL is substituted from .env by
# entrypoint.sh at start. Limits follow camera-relay-service/mosquitto/mosquitto.conf.
listener 1883
allow_anonymous false
password_file /run/mosquitto-auth/passwd
acl_file /run/mosquitto-auth/aclfile
persistence true
persistence_location /mosquitto/data/
autosave_interval 30
max_packet_size 262144
max_queued_messages 100000
max_queued_bytes 67108864
log_dest stdout
log_type error
log_type warning
log_type notice
