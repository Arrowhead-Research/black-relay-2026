[project]
name = "cameralink"
version = "0.0.0"
description = "Black Relay camera subsystem camera link: configures a factory-fresh Reolink RLC-520A from the edge node."
requires-python = ">=3.11"
dependencies = [
    "reolink_aio==0.22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cameralink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
