# Black Relay camera-subsystem edge bridge — example configuration.
#
# Copy to a real path (e.g. /etc/camerabridge/bridge.yaml), fill in the broker
# credentials, and run:   camerabridge run --config /etc/camerabridge/bridge.yaml
# (equivalently: python -m camerabridge run --config <path>)
#
# This file contains NO real secrets — the placeholders below must be replaced at
# onboarding (DESIGN.md 7.2). Keep the deployed copy readable only by the service
# user.
#
# On a camera node the setup portal writes this file. A copy placed by hand on a
# blank node (one with no saved portal config) is removed when camera-provision
# starts, so the bridge stays off until the portal is submitted.

# This node's identity. Must match ^[a-z0-9][a-z0-9-]*$. In v0 camera_id == node_id
# (one RLC-520A per node), so this is also the camera id on every detection.
node_id: cam-01

# Central fusion MQTT broker (required). Camera.* events, cue-acks and status are
# published here and RF cues are consumed from here. This connection drives the
# outbox: a central outage only queues durable events, which replay on reconnect.
# Frigate does NOT publish here; see frigate.mqtt_host below (DESIGN.md 4.1).
broker:
  host: 10.0.0.2          # central node address on the site LAN (not the WAN)
  port: 1883
  username: camera-cam-01  # per-node broker credential set at onboarding
  password: CHANGE-ME      # placeholder — replace with the real secret
  tls: false               # set true (and provision CA/certs) for a TLS broker

# Site zones THIS node's camera covers, drawn from the shared cross-subsystem zone
# vocabulary (DESIGN.md 6). An inbound RF cue only correlates to a track when the
# cue's zone is one of these.
covered_zones:
  - perimeter-north
  - driveway

# RF-cue correlation window (seconds, ±). A cue matches an open track in the same
# covered zone whose last sighting is within this window (DESIGN.md 5.4).
cue_window_s: 5.0

# Durable on-disk outbox. Significant events (object_start/object_end, cue-acks,
# status) are written here before publishing at QoS 1 and replayed across an
# outage or restart; object_update is QoS 0 and never persisted (DESIGN.md 5.5).
outbox:
  path: /var/lib/camerabridge/outbox.jsonl
  max_bytes: 67108864      # 64 MiB on-disk cap; oldest durable entries shed first
  max_age_s: 604800        # 7 days; entries older than this are shed on overflow

# Node status heartbeat cadence (seconds). Frigate stats older than 3 of these count
# as stale, whether by receipt or by their own timestamp, and camera_online /
# detector_ok / recording_ok then report false. Keep
# Frigate's mqtt.stats_interval (default 60) below 3 x this value, or a healthy node
# will report false between stats messages.
status_interval_s: 30

# Edge Frigate. `topic` is the Frigate events topic subscribed on the local broker
# (its prefix must match Frigate's mqtt.topic_prefix);
# `base_url` is the node-local Frigate address used to MINT snapshot_url on each
# detection (service-side — the parser leaves it null; DESIGN.md 5.6). Only the central
# node reaches base_url, and clients fetch through the central API, never the WAN.
frigate:
  topic: frigate/events
  base_url: https://cam-01.local:8971
  # The camera's name in Frigate's config: selects its entry in frigate/stats and its
  # frigate/<camera>/recordings/state topic. If unset, camera_online and recording_ok
  # always report false.
  camera: cam-01
  # The node-local MQTT broker. Point Frigate's `mqtt:` config at this same broker,
  # never at the central one: if Frigate publishes centrally, a central outage loses
  # every event it emits during that outage. The bridge's local connection only
  # subscribes to Frigate topics here, and it reconnects independently of `broker`.
  # Installing and running this broker on the node is an ops step, not done by the
  # bridge. Defaults: 127.0.0.1:1883.
  mqtt_host: 127.0.0.1
  mqtt_port: 1883
