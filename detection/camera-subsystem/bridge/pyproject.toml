[project]
name = "camerabridge"
version = "0.0.0"
description = "Black Relay camera subsystem edge bridge: translates Frigate MQTT object events into the normalized, versioned camera.* contract and delivers them durably to the fusion broker."
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.2,<2.3",
    "pyyaml>=6.0",
]

[project.scripts]
# Console-script entry so `camerabridge run --config <path>` works once the
# project is installed. A matching `python -m camerabridge` entry lives in
# src/camerabridge/__main__.py.
camerabridge = "camerabridge.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.20",
    "pytest>=8.0",
]

# Task 7 wires the service and ships the CLI, so the project is now a real,
# installable package (it was non-packaged while only schemas/skeleton existed).
# Hatchling builds the src/ layout; `uv run` installs it, exposing the console
# script and making `camerabridge` importable without the pytest pythonpath.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camerabridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
