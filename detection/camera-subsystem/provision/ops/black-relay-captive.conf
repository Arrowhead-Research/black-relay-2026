# Install in /etc/NetworkManager/dnsmasq-shared.d/. Read only by the dnsmasq that
# NetworkManager runs for ipv4.method=shared, which is the setup AP on wlan0.
# Every name resolves to the portal, so phones find it through their captive checks.
address=/#/10.42.0.1
# Never forward: the AP has no upstream, and a query for another record type (AAAA, HTTPS)
# would stall. local= answers those at once with no data, so clients use the A record.
no-resolv
local=/#/
