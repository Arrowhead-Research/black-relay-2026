# Install as /etc/mosquitto/conf.d/black-relay.conf. Node-local broker: Frigate publishes
# here and the bridge's local client subscribes. See README, "Node-local broker".
#
# Loopback only. The bridge's local connection has no credentials, so this listener is
# anonymous, which is safe only because nothing off the node can reach it. Frigate must
# run with host networking (network_mode: host) to reach it at 127.0.0.1:1883.
listener 1883 127.0.0.1
allow_anonymous true

# Frigate republishes its retained state when it reconnects, so a broker restart loses
# nothing that matters, and this saves SD writes.
persistence false
