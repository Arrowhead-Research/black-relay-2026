# Install as /etc/systemd/system/ssh.service.d/black-relay.conf.
# With no firewall table, port 22 would answer on every interface, so sshd does not start. A
# console is the way in then: see README, "If nftables fails at boot".
[Unit]
After=nftables.service

[Service]
ExecStartPre=/bin/sh -c '/usr/sbin/nft list table inet black_relay >/dev/null'
