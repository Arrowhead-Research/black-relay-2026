[project]
name = "cameraprovision"
version = "0.0.0"
description = "Black Relay camera subsystem edge-node onboarding: setup AP, captive portal, uplink watchdog, and the state machine that ties them together."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
camera-provision = "cameraprovision.__main__:main"

[dependency-groups]
dev = [
    # Test-only: proves the written YAML loads through the bridge's real config
    # path. Never a runtime dependency of the provisioner.
    "camerabridge",
    "pytest>=8.0",
]

[tool.uv.sources]
camerabridge = { path = "../bridge", editable = true }

# Hatchling builds the src/ layout; the wheel must carry templates/*.html, which
# portal.py loads at import. tests/test_packaging.py proves that from a clean venv.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cameraprovision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
