# Pinned to Mosquitto 2.1.2. entrypoint.sh creates the two files under /run from .env.
listener 1883
allow_anonymous false
password_file /run/mosquitto-auth/passwd
acl_file /run/mosquitto-auth/aclfile

# The API's session and its queued QoS 1 messages survive a broker restart. A clean stop loses
# nothing. A kill or power cut loses what was queued in the last 30 s, because that is how often
# this is written out. Nodes delete an event from their outbox on PUBACK, so the node's own
# storage is then all that is left of it.
persistence true
persistence_location /mosquitto/data/
autosave_interval 30

# The API refuses anything over 16 KB. This is well above that, so that a broker refusal does not
# wedge a node's outbox over a message the API would count and drop.
message_size_limit 262144
# What an API outage can hold, in a size a Pi can spare. Past either limit new messages for the
# API are dropped by the broker, though the node already has its PUBACK.
max_queued_messages 100000
max_queued_bytes 67108864

log_dest stdout
log_type error
log_type warning
log_type notice
