# Pinned to Mosquitto 2.1.2. entrypoint.sh creates the two files under /run from .env.
listener 1883
allow_anonymous false
password_file /run/mosquitto-auth/passwd
acl_file /run/mosquitto-auth/aclfile

# The API's session and its queued QoS 1 messages survive a broker restart. Nodes hold their
# own durable events in an outbox, but this keeps a replay from being lost while the API is down.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 100000

log_dest stdout
log_type error
log_type warning
log_type notice
