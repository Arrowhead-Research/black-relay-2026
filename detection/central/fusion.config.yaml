# Fusion on the central server (root compose.yaml): one broker, the central broker beside it.
database: /data/fusion.sqlite3
camera_schemas: /contracts/camera
rf_schemas: /contracts/rf
physical_schemas: /contracts/physical
camera_snapshot_password_env: FUSION_CAMERA_PASSWORD
brokers:
  - id: central
    namespace: central
    host: broker
    port: 1883
    client_id: fusion-central-v1
    subsystems: [camera, rf, physical]
    physical_node_id: physical-bridge-01
    site_id: sh1
    username_env: FUSION_CENTRAL_MQTT_USER
    password_env: FUSION_CENTRAL_MQTT_PASSWORD
