# Read-write registry: the ONLY instance that accepts pushes. Its port takes the publisher login only.
version: 0.1
log:
  level: info
  formatter: text
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
http:
  addr: :5000
  tls:
    certificate: /tls/server.crt
    key: /tls/server.key
    minimumtls: tls1.2
  headers:
    X-Content-Type-Options: [nosniff]
auth:
  htpasswd:
    realm: black-relay
    path: /auth/htpasswd
health:
  storagedriver:
    enabled: true
    interval: 30s
    threshold: 3
