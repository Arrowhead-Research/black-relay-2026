# Read-only registry over the same storage (mounted :ro). Clients pull here with their own login;
# no login on this port can push, delete or overwrite anything.
version: 0.1
log:
  level: info
  formatter: text
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  maintenance:
    readonly:
      enabled: true
    uploadpurging:
      enabled: false
http:
  addr: :5000
  tls:
    certificate: /tls/server.crt
    key: /tls/server.key
    minimumtls: tls1.2
  headers:
    X-Content-Type-Options: [nosniff]
auth:
  htpasswd:
    realm: black-relay
    path: /auth/htpasswd
