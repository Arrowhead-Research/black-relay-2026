---
# Intentionally contains no production host, address, or SSH details. It is
# used only for credential-free Pi/CI checks. Non-secret desired state is in
# production-vars.yml. A trusted operator copies hosts.example.yml outside the
# repository, replaces its connection placeholders, sets ANSIBLE_INVENTORY to
# that protected file, and validates it before deployment.
all:
  children:
    identity_stack:
      hosts: {}
