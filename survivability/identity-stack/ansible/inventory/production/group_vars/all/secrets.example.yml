---
# Safe variable-name inventory only. A trusted operator creates the real
# SOPS-encrypted file on a trusted workstation and commits it encrypted:
#
#   sops ansible/inventory/production/group_vars/all/secrets.sops.yml
#
# Never commit plaintext values, paste them into chat, or send them to Pi.
# Phase 7 backup secrets; see docs/runbooks/phase7-backup-foundation.md. The
# backup SSH private key is the dedicated key authorized on the home-scoped
# Storage Box subaccount.
backup_restic_repository_password: "REPLACE_WITH_RESTIC_REPOSITORY_PASSWORD"
backup_restic_ssh_private_key: "REPLACE_WITH_BACKUP_SSH_PRIVATE_KEY"
backup_restic_healthchecks_backup_url: "https://hc-ping.com/REPLACE_WITH_BACKUP_CHECK_UUID"
backup_restic_healthchecks_maintenance_url: "https://hc-ping.com/REPLACE_WITH_MAINT_CHECK_UUID"
# Identity-stack secrets used by later phases.
lldap_jwt_secret: "CHANGE_ME_LLDAP_JWT_SECRET"
lldap_key_seed: "CHANGE_ME_LLDAP_KEY_SEED"
lldap_admin_password: "CHANGE_ME_LLDAP_ADMIN_PASSWORD"
lldap_pocket_id_bind_password: "CHANGE_ME_LLDAP_POCKET_ID_BIND_PASSWORD"
pocket_id_encryption_key: "CHANGE_ME_POCKET_ID_ENCRYPTION_KEY"
pocket_id_ldap_bind_password: "CHANGE_ME_POCKET_ID_LDAP_BIND_PASSWORD"
headscale_oidc_client_id: "CHANGE_ME_HEADSCALE_OIDC_CLIENT_ID"
headscale_oidc_client_secret: "CHANGE_ME_HEADSCALE_OIDC_CLIENT_SECRET"
# Optional until outbound email is introduced.
smtp_username: "CHANGE_ME_SMTP_USERNAME"
smtp_password: "CHANGE_ME_SMTP_PASSWORD"
