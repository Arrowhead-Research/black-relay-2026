---
# Safe variable-name inventory only. A trusted operator creates the real
# SOPS-encrypted file on a trusted workstation and commits it encrypted:
#
#   sops ansible/inventory/production/group_vars/all/secrets.sops.yml
#
# Never commit plaintext values, paste them into chat, or send them to Pi.
# Phase 7 backup secrets; see docs/runbooks/backups.md. The
# backup SSH private key is the dedicated key authorized on the home-scoped
# Storage Box subaccount.
backup_restic_repository_password: "REPLACE_WITH_RESTIC_REPOSITORY_PASSWORD"
backup_restic_ssh_private_key: |-
  REPLACE_WITH_BACKUP_SSH_PRIVATE_KEY_CONTENTS_PRESERVING_LINE_BREAKS
backup_restic_healthchecks_backup_url: "https://hc-ping.com/REPLACE_WITH_BACKUP_CHECK_UUID"
backup_restic_healthchecks_maintenance_url: "https://hc-ping.com/REPLACE_WITH_MAINT_CHECK_UUID"
# Service secrets; see docs/runbooks/service-deployment.md. Generate the LLDAP
# values and passwords independently. Pocket ID's encryption key is 32 random
# bytes encoded as base64. The Headscale client values are issued by Pocket ID
# between bootstrap-only and full convergence.
lldap_jwt_secret: "CHANGE_ME_LLDAP_JWT_SECRET"
lldap_key_seed: "CHANGE_ME_LLDAP_KEY_SEED"
lldap_admin_password: "CHANGE_ME_LLDAP_ADMIN_PASSWORD"
lldap_pocket_id_bind_password: "CHANGE_ME_LLDAP_POCKET_ID_BIND_PASSWORD"
pocket_id_encryption_key: "CHANGE_ME_BASE64_32_BYTE_POCKET_ID_KEY"
headscale_oidc_client_id: "CHANGE_ME_AFTER_POCKET_ID_BOOTSTRAP"
headscale_oidc_client_secret: "CHANGE_ME_AFTER_POCKET_ID_BOOTSTRAP"
# SMTP relay credentials for Pocket ID's one-time access codes; see
# docs/runbooks/service-deployment.md. These are not account login details:
# create a dedicated SMTP user under Sending > SMTP Users in the SMTP2GO
# dashboard, which issues this pair. Required only when
# identity_stack_pocket_id_smtp_enabled is true. Neither value may contain a
# line break.
pocket_id_smtp_username: "CHANGE_ME_SMTP2GO_SMTP_USERNAME"
pocket_id_smtp_password: "CHANGE_ME_SMTP2GO_SMTP_PASSWORD"
# Edge secret; see docs/runbooks/service-deployment.md. At least 32 URL-safe
# characters. The edge role registers this exact key with the CrowdSec local API
# instead of accepting the host-local key the Debian postinst generates, so a
# rebuilt or restored host converges to a working bouncer.
crowdsec_bouncer_api_key: "CHANGE_ME_CROWDSEC_BOUNCER_API_KEY"
