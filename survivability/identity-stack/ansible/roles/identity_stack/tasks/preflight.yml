---
- name: Load SOPS-delivered identity secrets
  community.sops.load_vars:
    file: "{{ identity_stack_secrets_file }}"
    expressions: ignore
  no_log: true
  diff: false

- name: Validate non-secret identity configuration
  ansible.builtin.assert:
    that:
      - identity_stack_bootstrap_only is boolean
      - lldap_base_dn is match('^dc=[a-z0-9-]+(,dc=[a-z0-9-]+)+$')
      - lldap_admin_username is match('^[a-z][a-z0-9._-]+$')
      - lldap_admin_email is match('^[^@ ]+@[^@ ]+\.[^@ ]+$')
      - pocket_id_domain is match('^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}$')
      - headscale_domain is match('^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}$')
      - headscale_magic_dns_domain is match('^[a-z0-9][a-z0-9.-]+\.[a-z]{2,}$')
      - pocket_id_domain != headscale_domain
      - headscale_magic_dns_domain != headscale_domain
      # A counted list only proved nobody had edited it. These prove the group
      # model holds: every gate the role enforces is a group the role creates,
      # and the administrator is inside the membership tier. Losing either
      # would lock every user out of Pocket ID on the next sync.
      - identity_stack_membership_group in identity_stack_required_groups
      - identity_stack_pocket_id_admin_group in identity_stack_required_groups
      - identity_stack_headscale_allowed_group in identity_stack_required_groups
      - identity_stack_membership_group in identity_stack_admin_memberships
      - identity_stack_team_groups | difference(identity_stack_required_groups)
        | length == 0
      - identity_stack_capability_groups
        | difference(identity_stack_required_groups) | length == 0
      - identity_stack_membership_group not in identity_stack_team_groups
      - identity_stack_required_groups | unique | length
        == identity_stack_required_groups | length
      - identity_stack_pocket_id_bind_username not in [lldap_admin_username]
    fail_msg: >-
      Identity configuration is incomplete. Fill the external inventory values
      documented in docs/runbooks/service-deployment.md.

- name: Validate LLDAP and Pocket ID secrets
  ansible.builtin.assert:
    that:
      - lldap_jwt_secret | length >= 32
      - lldap_key_seed | length >= 32
      - lldap_admin_password | length >= 20
      - lldap_pocket_id_bind_password | length >= 20
      - pocket_id_encryption_key | length >= 40
      - lldap_jwt_secret is not search('REPLACE_WITH|CHANGE_ME')
      - lldap_key_seed is not search('REPLACE_WITH|CHANGE_ME')
      - lldap_admin_password is not search('REPLACE_WITH|CHANGE_ME')
      - lldap_pocket_id_bind_password is not search('REPLACE_WITH|CHANGE_ME')
      - pocket_id_encryption_key is not search('REPLACE_WITH|CHANGE_ME')
      - "'\n' not in lldap_admin_password"
      - "'\n' not in lldap_pocket_id_bind_password"
    fail_msg: >-
      LLDAP or Pocket ID secrets are missing, too short, or contain placeholders.
      Edit only the SOPS-encrypted production secrets file.
  no_log: true
  diff: false

# The env file is consumed with `format: raw`, so no value is quoted or
# unescaped. A newline in either credential silently truncates SMTP_PASSWORD
# and turns the remainder of the file into unparseable keys, which presents as
# unrelated settings going missing rather than as a credential error.
- name: Validate Pocket ID SMTP relay configuration
  ansible.builtin.assert:
    that:
      # assert evaluates these in order and stops at the first false one, so
      # the presence checks must precede every condition that dereferences a
      # value. Without them, enabling the relay before the credentials exist
      # raises a bare undefined-variable error instead of the message below,
      # and no_log makes that error opaque about which value is missing.
      - pocket_id_smtp_username is defined
      - pocket_id_smtp_password is defined
      - pocket_id_smtp_from is defined
      - identity_stack_pocket_id_smtp_tls in ['none', 'starttls', 'tls']
      - identity_stack_pocket_id_smtp_port | int > 0
      - identity_stack_pocket_id_smtp_port | int < 65536
      - pocket_id_smtp_from is match('^[^@ ]+@[^@ ]+\.[^@ ]+$')
      - pocket_id_smtp_username | length >= 6
      - pocket_id_smtp_password | length >= 12
      - pocket_id_smtp_username is not search('REPLACE_WITH|CHANGE_ME')
      - pocket_id_smtp_password is not search('REPLACE_WITH|CHANGE_ME')
      - "'\n' not in pocket_id_smtp_username"
      - "'\n' not in pocket_id_smtp_password"
      # An unencrypted relay would put every one-time access code on the wire
      # in cleartext, and disabling verification would accept any interceptor's
      # certificate. Neither is a supportable way to carry a login credential.
      - identity_stack_pocket_id_smtp_tls != 'none'
    fail_msg: >-
      Pocket ID SMTP is enabled but its relay settings are incomplete. Create an
      SMTP user in the SMTP2GO dashboard, store the credentials through SOPS,
      and set pocket_id_smtp_from in the external inventory. See
      docs/runbooks/service-deployment.md.
  when: identity_stack_pocket_id_smtp_enabled | bool
  no_log: true
  diff: false

- name: Validate Headscale OIDC secrets for full convergence
  ansible.builtin.assert:
    that:
      - headscale_oidc_client_id | length >= 8
      - headscale_oidc_client_secret | length >= 20
      - headscale_oidc_client_id is not search('REPLACE_WITH|CHANGE_ME')
      - headscale_oidc_client_secret is not search('REPLACE_WITH|CHANGE_ME')
      - "'\n' not in headscale_oidc_client_secret"
    fail_msg: >-
      Create the confidential Headscale client in Pocket ID, then store its ID
      and secret through SOPS before running full convergence.
  when: not identity_stack_bootstrap_only | bool
  no_log: true
  diff: false

- name: Inspect existing Headscale state
  ansible.builtin.stat:
    path: "{{ identity_stack_headscale_data_dir }}/db.sqlite"
  register: identity_stack_existing_headscale_database
  check_mode: false

- name: Prevent bootstrap-only mode from removing an established Headscale
  ansible.builtin.assert:
    that:
      - >-
        not (identity_stack_bootstrap_only | bool and
        identity_stack_existing_headscale_database.stat.exists)
    fail_msg: >-
      Bootstrap-only mode is valid only before Headscale's first deployment.
      Run normal full convergence on this established stack.
