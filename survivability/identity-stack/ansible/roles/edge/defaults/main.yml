---
# Non-secret configuration only. The bouncer's local API credential is loaded
# from the SOPS-encrypted secrets file referenced by edge_secrets_file.
edge_secrets_file: >-
  {{ playbook_dir }}/../inventory/production/group_vars/all/secrets.sops.yml

edge_root: /srv/edge
edge_compose_file: /srv/edge/compose.yml
edge_caddyfile: /srv/edge/Caddyfile
edge_caddy_candidate: /srv/edge/Caddyfile.candidate
edge_caddy_data_dir: /srv/edge/data
edge_caddy_config_dir: /srv/edge/config
edge_caddy_log_dir: /srv/edge/logs

# Reviewed multi-architecture manifest digest for caddy:2.11.4-alpine.
edge_caddy_image: >-
  docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
edge_caddy_memory_limit: 512M
edge_caddy_cpu_limit: "0.50"
edge_lldap_loopback_port: 17170

edge_proxy_network: identity_proxy
edge_proxy_network_subnet: 172.29.0.0/24
edge_caddy_proxy_address: 172.29.0.2
edge_backend_network: identity_backend
edge_backend_network_subnet: 172.29.1.0/24
edge_caddy_backend_address: 172.29.1.2

# Exact package versions from CrowdSec's signed repository. Both packages and
# the hub-update timer are held; upgrades remain reviewed Ansible changes.
edge_crowdsec_version: 1.8.1
edge_crowdsec_bouncer_version: 0.0.36
edge_crowdsec_repository: >-
  deb [signed-by=/etc/apt/keyrings/crowdsec.asc]
  https://packagecloud.io/crowdsec/crowdsec/any any main
edge_crowdsec_key_url: https://packagecloud.io/crowdsec/crowdsec/gpgkey
edge_crowdsec_key_fingerprint: 6A89E3C2303A901A889971D3376ED5326E93CD0C
edge_crowdsec_collections:
  - crowdsecurity/sshd
  - crowdsecurity/caddy
edge_crowdsec_acquisition_file: /etc/crowdsec/acquis.d/survivability.yaml
edge_crowdsec_bouncer_override: >-
  /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.local

# The bouncer's local API credential is operator-generated and stored in SOPS
# rather than left to the Debian postinst, which generates a host-local key that
# exists nowhere in this repository. A postinst key cannot be reproduced on a
# rebuilt host, and survives a restore only if /etc/crowdsec and the local API
# database under /var/lib/crowdsec are restored together and in step. Owning the
# credential here makes registration idempotent and rebuild-safe.
edge_crowdsec_lapi_url: http://127.0.0.1:8080
edge_crowdsec_bouncer_name: survivability-firewall-bouncer
# Names matching this prefix are credentials the postinst registered for itself.
# They are held by nobody once this role owns the key, so they are pruned.
edge_crowdsec_bouncer_autogenerated_prefix: crowdsec-firewall-bouncer-
